name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Start production server
        run: |
          npm run start > /tmp/visit-cambodia-next.log 2>&1 &
          echo $! > /tmp/visit-cambodia-next.pid

      - name: Route smoke test
        env:
          BASE_URL: http://127.0.0.1:3000
        run: node scripts/verify-routes.mjs

      - name: Server log on failure
        if: failure()
        run: cat /tmp/visit-cambodia-next.log || true
